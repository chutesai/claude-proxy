name: CI

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn
  MODEL: zai-org/GLM-4.5-Air
  PROXY_URL: http://127.0.0.1:8080

jobs:
  quality:
    name: Rust And Script Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit Tests
        run: cargo test --all-targets

      - name: Check Shell Script Syntax
        run: bash -n test.sh validate_tests.sh tests/*.sh

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Make Scripts Executable
        run: chmod +x test.sh validate_tests.sh tests/*.sh tests/mock_openai_backend.py

      - name: Start Mock Backend
        run: |
          python3 tests/mock_openai_backend.py --port 8000 > mock-backend.log 2>&1 &
          echo $! > mock-backend.pid

      - name: Wait For Mock Backend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/v1/models > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Mock backend failed to start"
          cat mock-backend.log
          exit 1

      - name: Start Proxy
        run: |
          BACKEND_URL=http://127.0.0.1:8000/v1/chat/completions \
          HOST_PORT=8080 \
          target/release/claude_openai_proxy > proxy.log 2>&1 &
          echo $! > proxy.pid

      - name: Wait For Proxy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Proxy failed to start"
          cat proxy.log
          exit 1

      - name: Core Integration Tests
        env:
          CHUTES_TEST_API_KEY: test
        run: ./test.sh --ci --all

      - name: Feature Integration Tests
        env:
          CHUTES_TEST_API_KEY: test
        run: |
          ./tests/test_claude_code_patterns.sh
          ./tests/test_multimodal.sh
          ./tests/test_tool_results.sh
          ./tests/test_token_count.sh
          ./tests/test_model_404.sh
          ./tests/test_model_case_correction.sh
          ./tests/test_non_streaming.sh

      - name: Thinking Integration Test
        env:
          CHUTES_TEST_API_KEY: test
          MODEL: deepseek-r1
        run: ./tests/test_thinking.sh

      - name: API Compliance Validation
        env:
          CHUTES_TEST_API_KEY: test
        run: ./tests/validate_claude_api.sh "$PROXY_URL"

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            mock-backend.log
            proxy.log

      - name: Stop Services
        if: always()
        run: |
          kill "$(cat proxy.pid)" 2>/dev/null || true
          kill "$(cat mock-backend.pid)" 2>/dev/null || true
